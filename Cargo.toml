[package]
repository = "https://github.com/enz1m/music"
name = "music-app"
version = "0.2.1"
authors = ["enzUI contributors"]
edition = "2024"
publish = false
license = "MIT"
description = "Play local music, podcasts, and internet radio"
rust-version = "1.95"

# Cargo applies dependency patches from this isolated workspace root.
[workspace]
resolver = "3"

[features]
x11 = ["iced/x11", "enzui-widgets/x11"]
center = ["dep:enzui-agent"]

[dependencies]
url = "2"
# Portal and theme-detection D-Bus backends require the Tokio executor.
iced = { default-features = false, features = ["wgpu", "tiny-skia", "crisp", "web-colors", "thread-pool", "linux-theme-detection", "wayland", "wayland-dlopen", "wayland-decorations", "canvas", "svg", "a11y", "tokio"], git = "https://github.com/enz1m/enzim-iced.git", rev = "523c1755479c55ba4030dafb2be9c05bf8a1def4" }
iced_renderer = { default-features = false, git = "https://github.com/enz1m/enzim-iced.git", rev = "523c1755479c55ba4030dafb2be9c05bf8a1def4" }
enzui-core = { features = ["accesskit"], git = "https://github.com/enz1m/enzui.git", rev = "0ed41783775a9bf1b431a7f5b57f782e30210552" }
enzui-services = { features = ["gstreamer", "mpris", "oauth", "secret-service"], git = "https://github.com/enz1m/enzui.git", rev = "0ed41783775a9bf1b431a7f5b57f782e30210552" }
enzui-resources = { git = "https://github.com/enz1m/enzui.git", rev = "0ed41783775a9bf1b431a7f5b57f782e30210552" }
enzui-theme = { git = "https://github.com/enz1m/enzui.git", rev = "0ed41783775a9bf1b431a7f5b57f782e30210552" }
enzui-widgets = { features = ["portal-dbus", "application-dbus"], git = "https://github.com/enz1m/enzui.git", rev = "0ed41783775a9bf1b431a7f5b57f782e30210552" }
quick-xml = "0.41"
curl = { version = "0.4.50", default-features = false, features = ["ssl"] }
tokio = { version = "1", features = ["rt"] }

lofty = "0.22"
# Decodes a track's waveform for the now-playing seek bar (already linked by enzui-services).
gstreamer = "0.23"
gstreamer-app = "0.23"
# Watches the built-in Spotify player's (Soloist's) local WebSocket API.
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
walkdir = "2"
fastrand = "2"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
enzui-agent = { features = ["iced-consumer"], optional = true, git = "https://github.com/enz1m/enzui.git", rev = "0ed41783775a9bf1b431a7f5b57f782e30210552" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"

[dev-dependencies]
tempfile = "3"
enzui-core = { features = ["test-frame"], git = "https://github.com/enz1m/enzui.git", rev = "0ed41783775a9bf1b431a7f5b57f782e30210552" }

iced_test = { git = "https://github.com/enz1m/enzim-iced.git", rev = "523c1755479c55ba4030dafb2be9c05bf8a1def4" }

[patch.crates-io]
zbus_macros = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
zbus_names = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
zvariant = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
zvariant_derive = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
zvariant_utils = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
zbus = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
winit = { git = "https://github.com/enz1m/enzim-winit.git", rev = "40eeb41f8637ef1620afa377ba006874224b6d65" }

[lints.rust]
unsafe_code = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = 0
incremental = false

[profile.test.package."*"]
opt-level = 2
debug = 0
incremental = false

[profile.release]
lto = false
codegen-units = 16
debug = 0
strip = "debuginfo"
