<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Music</title>
  <defs>
    <filter id="enz-music-drop" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="enz-music-vinyl">
      <circle cx="64" cy="64" r="46"/>
    </clipPath>
  </defs>

  <!-- circle keyline; record r 46 on (64 64) (18..110); label r 18 with a printed ring at r 12; grooves r 40 / 34 / 28 / 23;
       two light wedges between 200..215 deg and 20..35 deg -->
  <g filter="url(#enz-music-drop)">
    <circle cx="64" cy="64" r="46" fill="#262A33"/>
  </g>
  <g clip-path="url(#enz-music-vinyl)">
    <path d="M64 64 L-6 38 L-2 22 Z M64 64 L134 90 L130 106 Z" fill="#FFFFFF" fill-opacity="0.09"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5">
    <circle cx="64" cy="64" r="40"/>
    <circle cx="64" cy="64" r="34"/>
    <circle cx="64" cy="64" r="28"/>
    <circle cx="64" cy="64" r="23"/>
  </g>
  <circle cx="64" cy="64" r="45" fill="none" stroke="#434957" stroke-width="2"/>
  <circle cx="64" cy="64" r="18" fill="#FFB627"/>
  <circle cx="64" cy="64" r="12" fill="none" stroke="#E08E00" stroke-width="2"/>
  <circle cx="64" cy="64" r="3.5" fill="#262A33"/>
</svg>
